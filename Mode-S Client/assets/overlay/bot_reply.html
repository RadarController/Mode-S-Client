<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode-S Client Bot Reply Overlay</title>
  <style>
    :root {
      --brand-blue: #025492;
      --panel-bg: rgba(7, 14, 28, 0.88);
      --panel-border: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.48);
      --radius: 24px;
      --safe-top: 7vh;
      --safe-left: 5vw;
      --safe-right: 5vw;
      --max-width: 980px;
      --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    #wrap {
      position: fixed;
      top: var(--safe-top);
      left: var(--safe-left);
      right: var(--safe-right);
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #card {
      width: min(var(--max-width), 100%);
      box-sizing: border-box;
      border-radius: var(--radius);
      border: 1px solid var(--panel-border);
      background:
        linear-gradient(135deg, rgba(2, 84, 146, 0.96), rgba(2, 84, 146, 0.58) 38%, var(--panel-bg) 100%);
      box-shadow: var(--shadow);
      color: var(--text);
      opacity: 0;
      transform: translateY(-20px) scale(0.985);
      transition:
        opacity 220ms ease,
        transform 220ms ease;
      padding: 24px 28px;
    }

    #card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: clamp(18px, 2.2vw, 28px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .badge {
      flex: 0 0 auto;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 7px 12px;
      text-transform: uppercase;
      font-size: clamp(11px, 1.1vw, 15px);
      letter-spacing: 0.12em;
    }

    .user {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command {
      color: var(--muted);
      font-weight: 750;
      white-space: nowrap;
    }

    .reply {
      font-size: clamp(30px, 4.1vw, 58px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-wrap: balance;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: clamp(14px, 1.4vw, 20px);
      line-height: 1.25;
      font-weight: 650;
    }

    @media (orientation: portrait) {
      :root {
        --safe-top: 8vh;
        --safe-left: 6vw;
        --safe-right: 6vw;
        --max-width: 920px;
      }

      #card {
        padding: 26px 24px;
      }

      .reply {
        font-size: clamp(32px, 5.5vw, 64px);
      }
    }

    @media (max-width: 700px) {
      #card {
        padding: 20px 18px;
        border-radius: 20px;
      }

      .meta {
        gap: 8px;
        flex-wrap: wrap;
      }

      .reply {
        font-size: clamp(26px, 7vw, 44px);
      }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="card" aria-live="polite">
      <div class="meta">
        <span class="badge" id="platform">BOT</span>
        <span class="user" id="user">@viewer</span>
        <span class="command" id="command">!command</span>
      </div>
      <div class="reply" id="reply"></div>
      <div class="hint" id="hint">Replies appear on stream because TikTok native chat replies are unavailable in this mode.</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const platformFilter = (params.get("platform") || "").trim().toLowerCase();
    const showMs = Math.max(2500, Number.parseInt(params.get("show_ms") || "10000", 10) || 10000);
    const pollMs = Math.max(250, Number.parseInt(params.get("poll_ms") || "750", 10) || 750);
    const showHint = (params.get("hint") || "1") !== "0";

    const card = document.getElementById("card");
    const platformEl = document.getElementById("platform");
    const userEl = document.getElementById("user");
    const commandEl = document.getElementById("command");
    const replyEl = document.getElementById("reply");
    const hintEl = document.getElementById("hint");

    hintEl.style.display = showHint ? "block" : "none";

    let latestSeq = 0;
    let queue = [];
    let showing = false;
    let hideTimer = null;

    function text(value) {
      return value == null ? "" : String(value);
    }

    function displayName(user) {
      const clean = text(user).trim();
      if (!clean) return "@viewer";
      return clean.startsWith("@") ? clean : "@" + clean;
    }

    function commandText(command) {
      const clean = text(command).trim();
      if (!clean) return "";
      return clean.startsWith("!") ? clean : "!" + clean;
    }

    function showEvent(ev) {
      showing = true;

      platformEl.textContent = text(ev.platform || "bot").toUpperCase();
      userEl.textContent = displayName(ev.user);
      commandEl.textContent = commandText(ev.command);
      replyEl.textContent = text(ev.reply);

      card.classList.add("visible");

      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        card.classList.remove("visible");
        setTimeout(() => {
          showing = false;
          drainQueue();
        }, 260);
      }, showMs);
    }

    function drainQueue() {
      if (showing || queue.length === 0) return;
      showEvent(queue.shift());
    }

    async function poll() {
      try {
        const url = new URL("/api/bot/replies/recent", window.location.origin);
        url.searchParams.set("since", String(latestSeq));
        url.searchParams.set("limit", "20");
        if (platformFilter) url.searchParams.set("platform", platformFilter);

        const res = await fetch(url.toString(), { cache: "no-store" });
        if (!res.ok) return;

        const data = await res.json();
        if (typeof data.latest_seq === "number" && data.latest_seq > latestSeq) {
          latestSeq = data.latest_seq;
        }

        const events = Array.isArray(data.events) ? data.events : [];
        for (const ev of events) {
          if (!ev || !ev.reply) continue;
          if (typeof ev.seq === "number" && ev.seq > latestSeq) {
            latestSeq = ev.seq;
          }
          queue.push(ev);
        }

        drainQueue();
      } catch (_) {
        // Keep overlays silent on transient HTTP/startup errors.
      }
    }

    poll();
    setInterval(poll, pollMs);
  </script>
</body>
</html>
